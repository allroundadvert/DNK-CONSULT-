<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #111;
    color: #fff;
}

:root{
    --gold:#d4af37;
}

/* TOP IMAGE */
.hero-image{
    width:100%;
    border-bottom:3px solid var(--gold);
}

.hero-image img{
    width:100%;
    max-height:320px;
    object-fit:contain;
    display:block;
}

/* HEADER */
header {
    background: linear-gradient(90deg, #111, var(--gold), #111);
    color: #000;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 24px;
    color:#111;
    font-weight:900;
}

header p {
    margin: 5px 0;
    font-size: 14px;
    color:#111;
}

/* SLIDER */
.slider {
    width: 100%;
    overflow: hidden;
    border-bottom: 2px solid var(--gold);
}

.slider-track {
    display: flex;
    width: max-content;
    animation: slide 8s linear infinite;
}

.slider-track img {
    width: 100vw;
    height: 260px;
    object-fit: cover;
    flex-shrink: 0;
}

@keyframes slide {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

/* GALLERY */
.gallery {
    width: 95%;
    max-width: 1000px;
    margin: 15px auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.gallery img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border: 2px solid var(--gold);
    border-radius: 5px;
}

/* CONTAINER */
.container {
    width: 95%;
    max-width: 1000px;
    margin: 20px auto;
    background: #1a1a1a;
    padding: 15px;
    border-radius: 10px;
    border:1px solid var(--gold);
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

table, th, td {
    border: 1px solid var(--gold);
}

th {
    background: var(--gold);
    color: #111;
    padding: 10px;
    text-align: left;
    font-weight:900;
}

td {
    padding: 10px;
    background:#111;
}

input {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
    background:#000;
    border:1px solid var(--gold);
    color:#fff;
}

/* BUTTON */
.whatsapp-btn {
    display: inline-block;
    background: var(--gold);
    color: #111;
    padding: 12px 20px;
    margin-top: 15px;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
    border:2px solid #000;
}

h2{
    color:var(--gold);
}

/* MAP */
.map {
    margin-top: 25px;
    border: 2px solid var(--gold);
}

.map iframe {
    width: 100%;
    height: 350px;
    border: 0;
}
</style>
